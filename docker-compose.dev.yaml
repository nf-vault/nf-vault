services:
  database:
    image: postgres:13.3
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./.dev/DEV_DB_USR:/run/secrets/db_user:ro,z
      - ./.dev/DEV_DB_PWD:/run/secrets/db_password:ro,z
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d db -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - database_net
    ports:
      - "5454:5432"
  
  rabbitmq:
    image: rabbitmq:4-management
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rabbitmq_net

  backend:
    image: nf-vault-backend-dev:latest
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      DB_URL: postgresql://database:5432/db
      DB_USER_FILE: /run/secrets/db_user
      DB_PASSWORD_FILE: /run/secrets/db_password
      IMAGE_STORAGE_PATH: /data/images
      SEARCH_INDEX_PATH: /data/search
      RABBITMQ_HOST: rabbitmq
    networks:
      - database_net
      - rabbitmq_net
    volumes:
      - ./.dev/DEV_DB_USR:/run/secrets/db_user:ro,z
      - ./.dev/DEV_DB_PWD:/run/secrets/db_password:ro,z
      - image_data:/data/images
      - search_data:/data/search
    ports:
      - "8080:8080"

volumes:
  db_data:
  image_data:
  search_data:
  rabbitmq_data:

networks:
  database_net:
  web_server_net:
  rabbitmq_net: