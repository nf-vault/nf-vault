services:
  database:
    image: postgres:13.3
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_user
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    configs:
      - source: init-sql
        target: /docker-entrypoint-initdb.d/init.sql
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d db -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - database_net

  backend:
    image: nf-vault-backend:latest
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - database
      - rabbitmq
    environment:
      DB_URL: postgresql://database:5432/db
      DB_USER_FILE: /run/secrets/db_user
      DB_PASSWORD_FILE: /run/secrets/db_password
      IMAGE_STORAGE_PATH: /data/images
      SEARCH_INDEX_PATH: /data/search
      RABBITMQ_HOST: rabbitmq
    volumes:
      - image_data:/data/images
      - search_data:/data/search
    networks:
      - database_net
      - web_server_net
      - rabbitmq_net
    secrets:
      - db_user
      - db_password

  rabbitmq:
    image: rabbitmq:4-alpine
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rabbitmq_net
    
  nginx:
    image: nf-vault-frontend:latest
    restart: on-failure
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SSL_CERT_PATH:?SSL_CERT_PATH is required}:/etc/nginx/certs/cert.crt:ro,Z
      - ${SSL_KEY_PATH:?SSL_KEY_PATH is required}:/etc/nginx/certs/key.key:ro,Z
    networks:
      - web_server_net

secrets:
  db_user:
    external: true
  db_password:
    external: true

volumes:
  db_data:
  image_data:
  search_data:
  rabbitmq_data:

configs:
  init-sql:
    file: ./database/init.sql

networks:
  database_net:
  web_server_net:
  rabbitmq_net: