server.port = 8080

# Data Source Configuration
spring.datasource.url=jdbc:${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Image storage
image.storage-path=${IMAGE_STORAGE_PATH:/data/images}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Full-text search
search.index-path=${SEARCH_INDEX_PATH:/data/search}

# Documents preview
preview.font-path=/fonts/OpenSans-Medium.ttf

# Document OG generation
document-og.domain=${DOMAIN:https://example.com}
document-og.documents-service-url=${DOCUMENT_SERVICE_URL:/document}

# Outbox settings
outbox.amqp-exchange-name=${RABBITMQ_EXCHANGE_NAME:outbox.exchange}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:16}
outbox.publisher.delay=${OUTBOX_PUBLISHER_DELAY:PT1S}
outbox.publisher.processing-message-retry-timeout=${OUTBOX_PROCESSING_MESSAGE_RETRY_TIMEOUT:PT5M}
outbox.consumer.retry-delay-ms=${OUTBOX_CONSUMER_RETRY_DELAY_MS:1000}
outbox.consumer.max-attempts=${OUTBOX_CONSUMER_MAX_ATTEMPTS:3}
outbox.cleanup.retention=${OUTBOX_CLEANUP_RETENTION:PT10M}
outbox.cleanup.delay=${OUTBOX_CLEANUP_DELAY:PT10M}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbit}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit}